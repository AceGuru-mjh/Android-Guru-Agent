name: APK Build

# 独立 APK 构建流水线 —— 与 CI 解耦，按需出包：
#   - workflow_dispatch: 手动触发，可选 debug / release（release 以 debug 密钥签名，产物可直接安装）
#
# ⚠️ v1.4.1 起 tag 发布已移交 release.yml（双仓库发布架构）：
#   push tag v*.*.* → 构建产物经跨仓库 PAT 发布到 Android-Guru-Agent-Release。
#   本工作流仅保留手动触发，用于临时验证构建 —— 不再在开发仓库创建 Release。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建变体'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    # T84：完整 rootfs（~300MB+/ABI）暂存 + universal（含 3 份）打包 —— 45 分钟
    # 余量不足（fetch ~1.3GB + 两次 assemble + 1.3GB APK 产出）。
    timeout-minutes: 60
    permissions:
      contents: read    # 手动验证构建只读；对外发布走 release.yml 的跨仓库 PAT
    defaults:
      run:
        # bashisms 依赖：Build 步骤的 ${VARIANT^} 首字母大写、Resolve variant 的 [[ ]]。
        # runner 默认 sh(dash) 下 `${VARIANT^}` 报 bad substitution 直接失败 —— 显式 bash。
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # AGP 8.7.3 默认需要 NDK 27.0.12077973，runner 自带 27.3.x
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || \
          echo "⚠️ Could not install NDK 27.0.12077973, will try with pre-installed"
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK pre-installed"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10

      - name: Stage bundled Ubuntu rootfs (T83 内置交付)
        run: |
          # T83：Ubuntu rootfs 随 APK 内置（应用内下载安装已移除，基础环境离线可用）。
          # 构建期拉取 → 双重 SHA-256 校验 → 暂存为 jniLibs 伪 .so。
          # 失败即阻断构建 —— 绝不打包指纹不符的 rootfs。
          # T84 已切完整环境档（run #10 指纹，PR #131 钉值）：tag 构建产出
          # arm64 ~316MB / universal ~903MB（v1.3.0 实测）。
          scripts/fetch_rootfs.sh

      - name: Prewarm dependencies (retry on JitPack flakiness)
        run: |
          attempts=5
          for i in $(seq 1 $attempts); do
            if ./gradlew :app:dependencies \
                --configuration debugCompileClasspath \
                --write-locks \
                --stacktrace; then
              echo "✅ Dependency resolution succeeded on attempt $i"
              exit 0
            fi
            echo "⚠️ Dependency resolution attempt $i failed, retrying..."
            sleep $((i * 30))
          done
          echo "❌ Dependency resolution failed after $attempts attempts"
          exit 1

      - name: Resolve build variant
        id: variant
        run: |
          # 仅剩 workflow_dispatch 触发：变体直接取输入（默认 debug）
          echo "type=${{ inputs.build_type || 'debug' }}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          VARIANT=${{ steps.variant.outputs.type }}
          echo "🚀 Building $VARIANT APK..."
          # ${VARIANT^} = bash 首字母大写(debug→Debug, release→Release);花括号内禁止空格
          # T83：release 双产物 —— 先 universal（含全3 ABI rootfs，兼容旧设备/模拟器），
          # 再 arm64 纯净包（-PapexAbi 收窄 app 级 abiFilters，~50MB，绝大多数现代手机）。
          # 注意 1：android.injected.abi 会被模块显式 abiFilters 压过（实测无效），
          #   故用自定义 apexAbi 属性；abiFilters 是真实任务输入 → 重打包自然触发。
          # 注意 2（实测踩坑）：中间产物必须停放在任务输出目录之外（apk/ 层）——
          #   Gradle 重跑 packageRelease 时会把输出目录里的非本轮产物当 stale
          #   output 清理掉（留在 release/ 里的 universal 包会被第二次构建删除）。
          if [ "$VARIANT" = "release" ]; then
            ./gradlew ":app:assembleRelease" \
              --no-daemon \
              -Pkotlin.incremental=false \
              --stacktrace
            mv app/build/outputs/apk/release/app-release.apk \
               app/build/outputs/apk/app-universal-release.apk
            ./gradlew ":app:assembleRelease" \
              -PapexAbi=arm64-v8a \
              --no-daemon \
              -Pkotlin.incremental=false \
              --stacktrace
            mv app/build/outputs/apk/release/app-release.apk \
               app/build/outputs/apk/app-arm64-release.apk
          else
            ./gradlew ":app:assemble${VARIANT^}" \
              --no-daemon \
              -Pkotlin.incremental=false \
              --stacktrace
          fi

      - name: Collect artifact (rename with version + sha)
        id: artifact
        run: |
          VARIANT=${{ steps.variant.outputs.type }}
          APK_DIR="app/build/outputs/apk/$VARIANT"
          SHA8=$(echo "${{ github.sha }}" | cut -c1-8)
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "### 📦 APK 产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$VARIANT" = "release" ]; then
            # T83 双产物：arm64 纯净包（内置 rootfs 仅含 arm64）+ universal（全 3 ABI）
            #（中间产物停在 apk/ 层 —— 见 Build 步骤的踩坑注释）
            # T84：完整 rootfs 后 arm64 ~300MB+ / universal ~1.3GB（du -m 实测打印）。
            mv "$APK_DIR/../app-arm64-release.apk" \
               "$APK_DIR/ApexAgent-v${VERSION}-release-arm64-${SHA8}.apk"
            mv "$APK_DIR/../app-universal-release.apk" \
               "$APK_DIR/ApexAgent-v${VERSION}-release-universal-${SHA8}.apk"
            ARM64_APK="$APK_DIR/ApexAgent-v${VERSION}-release-arm64-${SHA8}.apk"
            UNI_APK="$APK_DIR/ApexAgent-v${VERSION}-release-universal-${SHA8}.apk"
            ARM64_MB=$(du -m "$ARM64_APK" | cut -f1)
            UNI_MB=$(du -m "$UNI_APK" | cut -f1)
            echo "📦 $(basename "$ARM64_APK") — ${ARM64_MB} MB（arm64-v8a，现代手机首选）"
            echo "📦 $(basename "$UNI_APK") — ${UNI_MB} MB（全 ABI：含 armeabi-v7a / x86_64）"
            echo "path=$ARM64_APK" >> "$GITHUB_OUTPUT"
            echo "path_universal=$UNI_APK" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$ARM64_APK")" >> "$GITHUB_OUTPUT"
            echo "- 文件: \`$(basename "$ARM64_APK")\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 大小: **${ARM64_MB} MB**（arm64-v8a；内置 Ubuntu rootfs 仅含 arm64）" >> "$GITHUB_STEP_SUMMARY"
            echo "- 另出 universal: \`$(basename "$UNI_APK")\` — ${UNI_MB} MB（含全部 3 ABI）" >> "$GITHUB_STEP_SUMMARY"
            echo "- 变体: release（debug 密钥签名，可直接安装）" >> "$GITHUB_STEP_SUMMARY"
          else
            APK=$(ls "$APK_DIR"/*.apk | head -1)
            if [ -z "$APK" ]; then
              echo "❌ No APK produced in $APK_DIR"
              exit 1
            fi
            DEST="ApexAgent-v${VERSION}-${VARIANT}-${SHA8}.apk"
            mv "$APK" "$APK_DIR/$DEST"
            echo "path=$APK_DIR/$DEST" >> "$GITHUB_OUTPUT"
            echo "name=$DEST" >> "$GITHUB_OUTPUT"
            SIZE_MB=$(du -m "$APK_DIR/$DEST" | cut -f1)
            echo "📦 $DEST — ${SIZE_MB} MB"
            echo "- 文件: \`$DEST\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- 大小: **${SIZE_MB} MB**" >> "$GITHUB_STEP_SUMMARY"
            echo "- 变体: $VARIANT（release 以 debug 密钥签名，可直接安装）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK artifact (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: apex-agent-apk-arm64
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact (universal)
        if: steps.artifact.outputs.path_universal != ''
        uses: actions/upload-artifact@v4
        with:
          name: apex-agent-apk-universal
          path: ${{ steps.artifact.outputs.path_universal }}
          if-no-files-found: error
          retention-days: 30
      # 对外发布（Release + APK + version.json + 增量补丁）已移交 release.yml：
      # 双仓库发布架构 —— 产物统一落在 Android-Guru-Agent-Release。
