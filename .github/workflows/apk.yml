name: APK Build

# 独立 APK 构建流水线 —— 与 CI 解耦，按需出包：
#   - workflow_dispatch: 手动触发，可选 debug / release（release 以 debug 密钥签名，产物可直接安装）
#   - push tag v*: 自动构建 release 并创建 GitHub Release 附带 APK
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建变体'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    tags:
      - 'v*'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (${{ inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release') || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # tag 构建时创建 Release 并上传产物

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # AGP 8.7.3 默认需要 NDK 27.0.12077973，runner 自带 27.3.x
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || \
          echo "⚠️ Could not install NDK 27.0.12077973, will try with pre-installed"
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK pre-installed"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10

      - name: Prewarm dependencies (retry on JitPack flakiness)
        run: |
          attempts=5
          for i in $(seq 1 $attempts); do
            if ./gradlew :app:dependencies \
                --configuration debugCompileClasspath \
                --write-locks \
                --stacktrace; then
              echo "✅ Dependency resolution succeeded on attempt $i"
              exit 0
            fi
            echo "⚠️ Dependency resolution attempt $i failed, retrying..."
            sleep $((i * 30))
          done
          echo "❌ Dependency resolution failed after $attempts attempts"
          exit 1

      - name: Resolve build variant
        id: variant
        run: |
          if [ "${{ inputs.build_type }}" != "" ]; then
            echo "type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          VARIANT=${{ steps.variant.outputs.type }}
          echo "🚀 Building $VARIANT APK..."
          ./gradlew :app:assemble${ VARIANT^ } \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace

      - name: Collect artifact (rename with version + sha)
        id: artifact
        run: |
          VARIANT=${{ steps.variant.outputs.type }}
          APK_DIR="app/build/outputs/apk/$VARIANT"
          APK=$(ls "$APK_DIR"/*.apk | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK produced in $APK_DIR"
            exit 1
          fi
          SHA8=$(echo "${{ github.sha }}" | cut -c1-8)
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          DEST="ApexAgent-v${VERSION}-${VARIANT}-${SHA8}.apk"
          mv "$APK" "$APK_DIR/$DEST"
          echo "path=$APK_DIR/$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"
          SIZE_MB=$(du -m "$APK_DIR/$DEST" | cut -f1)
          echo "📦 $DEST — ${SIZE_MB} MB"
          echo "### 📦 APK 产物" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 文件: \`$DEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 大小: **${SIZE_MB} MB**" >> "$GITHUB_STEP_SUMMARY"
          echo "- 变体: $VARIANT（release 以 debug 密钥签名，可直接安装）" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-agent-apk
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
          body: |
            ## Apex Agent ${{ github.ref_name }}

            自动构建产物 —— 见附件 APK。

            - 变体: release（debug 密钥签名，可直接安装）
            - 提交: ${{ github.sha }}
