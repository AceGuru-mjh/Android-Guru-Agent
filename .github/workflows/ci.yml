name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Kotlin compiler
        run: |
          curl -sL https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d $HOME/
          echo "$HOME/kotlinc/bin" >> $GITHUB_PATH

      - name: Download Maven dependencies
        run: |
          mkdir -p /tmp/apex-libs
          KOTLIN_VER=2.0.21
          COROUTINES_VER=1.9.0
          SERIALIZATION_VER=1.7.3
          OKHTTP_VER=4.12.0
          for dep in \
            "org/jetbrains/kotlin/kotlin-stdlib/$KOTLIN_VER/kotlin-stdlib-$KOTLIN_VER.jar" \
            "org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/$COROUTINES_VER/kotlinx-coroutines-core-jvm-$COROUTINES_VER.jar" \
            "org/jetbrains/kotlinx/kotlinx-serialization-json-jvm/$SERIALIZATION_VER/kotlinx-serialization-json-jvm-$SERIALIZATION_VER.jar" \
            "org/jetbrains/kotlinx/kotlinx-serialization-core-jvm/$SERIALIZATION_VER/kotlinx-serialization-core-jvm-$SERIALIZATION_VER.jar" \
            "com/squareup/okhttp3/okhttp/$OKHTTP_VER/okhttp-$OKHTTP_VER.jar" \
            "com/squareup/okio/okio-jvm/3.6.0/okio-jvm-3.6.0.jar"; do
            fname=$(basename "$dep")
            curl -sL "https://repo1.maven.org/maven2/$dep" -o "/tmp/apex-libs/$fname"
          done

      - name: Compile core:llm-adapter
        run: |
          CLASSPATH=$(find /tmp/apex-libs -name "*.jar" | tr '\n' ':')
          kotlinc -cp "$CLASSPATH" -d /tmp/build/llm-adapter \
            $(find core/llm-adapter/src/main/kotlin -name "*.kt") \
            -jvm-target 17

      - name: Compile core:tool-registry
        run: |
          CLASSPATH="$(find /tmp/apex-libs -name '*.jar' | tr '\n' ':')/tmp/build/llm-adapter"
          kotlinc -cp "$CLASSPATH" -d /tmp/build/tool-registry \
            $(find core/tool-registry/src/main/kotlin -name "*.kt") \
            -jvm-target 17

      - name: Compile core:agent-engine
        run: |
          CLASSPATH="$(find /tmp/apex-libs -name '*.jar' | tr '\n' ':')/tmp/build/llm-adapter:/tmp/build/tool-registry"
          kotlinc -cp "$CLASSPATH" -d /tmp/build/agent-engine \
            $(find core/agent-engine/src/main/kotlin -name "*.kt") \
            -jvm-target 17

      - name: Check tool ID uniqueness
        run: |
          IDS=$(grep -rh "override val id = " core/tool-registry/src/main/kotlin/ platform/terminal/src/main/kotlin/ | sort | uniq -d)
          if [ -n "$IDS" ]; then
            echo "❌ Duplicate tool IDs found:"
            echo "$IDS"
            exit 1
          fi
          TOTAL=$(grep -rh "override val id = " core/tool-registry/src/main/kotlin/ platform/terminal/src/main/kotlin/ | wc -l)
          echo "✅ $TOTAL unique tool IDs, no duplicates"

      - name: Check duplicate classes
        run: |
          DUPLICATES=$(grep -rh "^class \|^object \|^enum class \|^data class " --include="*.kt" . | sed 's/^[a-z ]*//' | sed 's/[<(].*//' | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then
            echo "⚠️ Potential duplicate class names (may be in different packages):"
            echo "$DUPLICATES"
          else
            echo "✅ No duplicate class names"
          fi

      - name: Check brace balance
        run: |
          FAIL=0
          for f in $(find . -name "*.kt" -not -path "./.git/*" -not -path "./build/*"); do
            OPENS=$(grep -o '{' "$f" | wc -l)
            CLOSES=$(grep -o '}' "$f" | wc -l)
            if [ "$OPENS" != "$CLOSES" ]; then
              echo "❌ $f: $OPENS open vs $CLOSES close"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 0 ]; then
            echo "✅ All .kt files have balanced braces"
          else
            exit 1
          fi
