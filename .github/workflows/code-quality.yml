name: Code Quality

# Parallel to ci.yml — runs Android Lint + ktlint + detekt.
#
# All three are NON-BLOCKING (step-level continue-on-error: true) so the
# tools ACTUALLY RUN and produce reports, but violations do not fail the PR.
# Reports are uploaded as artifacts for review.
#
# Current known violations (PR #70 baseline, detekt default ruleset):
#   - FakePackageManager.kt:10  TooManyFunctions (11 / threshold 11)
#   - PackageManager.kt:16      TooManyFunctions (11 / threshold 11)
#   - EnvironmentResolver.kt:60 LongMethod (77 lines / max 60)
#
# Promotion path:
#   1. This PR introduces the checks (non-blocking) + uploads reports.
#   2. Follow-up PRs fix the reported violations (refactor or add detekt.yml
#      with tuned thresholds).
#   3. Once a PR runs clean, remove continue-on-error: true here and add
#      the jobs to branch protection required checks.

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

jobs:
  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10

      - name: Prewarm dependencies
        run: |
          attempts=5
          for i in $(seq 1 $attempts); do
            if ./gradlew :app:dependencies --configuration debugCompileClasspath --write-locks --stacktrace; then
              echo "Dependencies resolved on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep $((i * 30))
          done
          echo "Dependency resolution failed after $attempts attempts"
          exit 1

      - name: Run Android Lint (platform:terminal + app)
        run: |
          set -o pipefail
          ./gradlew :platform:terminal:lintDebug :app:lintDebug \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace 2>&1 | tee lint.log
        continue-on-error: true

      - name: Lint summary
        if: always()
        run: |
          if grep -q "BUILD SUCCESSFUL" lint.log; then
            echo "Lint passed"
          else
            echo "Lint reported issues (non-blocking — see report artifact)"
          fi

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: |
            platform/terminal/build/reports/lint-results-*.txt
            platform/terminal/build/reports/lint-results-*.xml
            platform/terminal/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  ktlint:
    name: ktlint (Kotlin code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download ktlint (GitHub release bootstrap)
        run: |
          # The official ktlint distribution is the bash bootstrap script
          # from GitHub releases (NOT a Maven JAR — that download was
          # corrupt on PR #70 first run). The script downloads the JAR
          # on first invocation.
          curl -sSL https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint -o /tmp/ktlint
          chmod +x /tmp/ktlint
          /tmp/ktlint --version

      - name: Run ktlint
        run: |
          set -o pipefail
          /tmp/ktlint \
            --reporter=plain,output=ktlint-plain.txt \
            --reporter=checkstyle,output=ktlint-checkstyle.xml \
            "**/src/main/kotlin/**/*.kt" \
            "**/src/test/kotlin/**/*.kt" \
            2>&1 | tee ktlint.log
        continue-on-error: true

      - name: Upload ktlint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ktlint-reports
          path: |
            ktlint-plain.txt
            ktlint-checkstyle.xml
            ktlint.log
          if-no-files-found: ignore
          retention-days: 14

  detekt:
    name: detekt (Kotlin static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download detekt-cli
        run: |
          DETEKT_VERSION=1.23.7
          curl -sSL "https://github.com/detekt/detekt/releases/download/v$DETEKT_VERSION/detekt-cli-$DETEKT_VERSION.zip" -o /tmp/detekt.zip
          unzip -q /tmp/detekt.zip -d /tmp/detekt
          ls /tmp/detekt/detekt-cli-$DETEKT_VERSION/bin/

      - name: Run detekt (default ruleset)
        run: |
          set -o pipefail
          DETEKT_VERSION=1.23.7
          /tmp/detekt/detekt-cli-$DETEKT_VERSION/bin/detekt-cli \
            --input platform/terminal/src/main/kotlin,app/src/main/kotlin,core \
            --report xml:detekt-report.xml,txt:detekt-report.txt \
            2>&1 | tee detekt.log
        continue-on-error: true

      - name: Upload detekt reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-reports
          path: |
            detekt-report.xml
            detekt-report.txt
            detekt.log
          if-no-files-found: ignore
          retention-days: 14
