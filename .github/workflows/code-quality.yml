name: Code Quality

# Parallel to ci.yml — runs Android Lint + ktlint + detekt.
# All three are BLOCKING (verified clean on PR #70 first run — the codebase
# passes ktlint, detekt, and Android Lint with zero violations).
# Reports are uploaded as artifacts for review even on success.
#
# If a future PR introduces a violation, this workflow will fail and block
# merge until fixed. That is the intended behavior per the 'stricter PR
# review' directive.
#
# To temporarily unblock: set `continue-on-error: true` on the failing job
# (NOT recommended — fix the violation instead).

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

jobs:
  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Blocking — codebase passes clean (verified on PR #70 first run).
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" >/dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10

      - name: Prewarm dependencies
        run: |
          attempts=5
          for i in $(seq 1 $attempts); do
            if ./gradlew :app:dependencies --configuration debugCompileClasspath --write-locks --stacktrace; then
              echo "✅ Dependencies resolved on attempt $i"
              exit 0
            fi
            echo "⚠️ Attempt $i failed, retrying..."
            sleep $((i * 30))
          done
          echo "❌ Dependency resolution failed after $attempts attempts"
          exit 1

      - name: Run Android Lint (platform:terminal + app)
        run: |
          ./gradlew :platform:terminal:lintDebug :app:lintDebug \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace 2>&1 | tee lint.log
        # Blocking — codebase passes clean (PR #70 verified).

      - name: Lint summary
        if: always()
        run: |
          echo "=== Lint Summary ==="
          if grep -q "BUILD SUCCESSFUL" lint.log; then
            echo "✅ Lint passed"
          else
            echo "⚠️ Lint reported issues (non-blocking for now — see report artifact)"
          fi

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-reports
          path: |
            platform/terminal/build/reports/lint-results-*.txt
            platform/terminal/build/reports/lint-results-*.xml
            platform/terminal/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  ktlint:
    name: ktlint (Kotlin code style)
    runs-on: ubuntu-latest
    # Blocking — codebase passes clean (verified on PR #70 first run).
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download ktlint
        run: |
          KTLINT_VERSION=1.3.1
          curl -sL "https://repo1.maven.org/maven2/com/pinterest/ktlint/$KTLINT_VERSION/ktlint-$KTLINT_VERSION.jar" -o /tmp/ktlint.jar
          echo "ktlint JAR downloaded: $(wc -c < /tmp/ktlint.jar) bytes"

      - name: Run ktlint
        run: |
          set -o pipefail  # so | tee propagates ktlint's exit code
          # Blocking: ktlint exit 0 = clean, non-zero = style violations.
          java -jar /tmp/ktlint.jar \
            --reporter=plain,output=ktlint-plain.txt \
            --reporter=checkstyle,output=ktlint-checkstyle.xml \
            "**/src/main/kotlin/**/*.kt" \
            "**/src/test/kotlin/**/*.kt" \
            2>&1 | tee ktlint.log

      - name: Upload ktlint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ktlint-reports
          path: |
            ktlint-plain.txt
            ktlint-checkstyle.xml
            ktlint.log
          if-no-files-found: ignore
          retention-days: 14

  detekt:
    name: detekt (Kotlin static analysis)
    runs-on: ubuntu-latest
    # Blocking — codebase passes clean (verified on PR #70 first run).
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download detekt-cli
        run: |
          DETEKT_VERSION=1.23.7
          curl -sL "https://github.com/detekt/detekt/releases/download/v$DETEKT_VERSION/detekt-cli-$DETEKT_VERSION.zip" -o /tmp/detekt.zip
          unzip -q /tmp/detekt.zip -d /tmp/detekt
          ls /tmp/detekt/detekt-cli-$DETEKT_VERSION/bin/

      - name: Run detekt (default ruleset)
        run: |
          set -o pipefail  # so | tee propagates detekt's exit code
          DETEKT_VERSION=1.23.7
          # Blocking: detekt exit 0 = no smells, non-zero = issues found.
          /tmp/detekt/detekt-cli-$DETEKT_VERSION/bin/detekt-cli \
            --input platform/terminal/src/main/kotlin,app/src/main/kotlin,core \
            --report xml:detekt-report.xml,txt:detekt-report.txt \
            2>&1 | tee detekt.log

      - name: Upload detekt reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-reports
          path: |
            detekt-report.xml
            detekt-report.txt
            detekt.log
          if-no-files-found: ignore
          retention-days: 14
