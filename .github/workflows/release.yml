name: Release (Cross-Repo)

# ═════════════════════════════════════════════════════════════════════════════
# 双仓库发布流水线 —— 开发仓库出代码，发布仓库出产物：
#
#   PR 合并进 main（push main）→ 全自动构建发布，无需再手动打 tag：
#       ├─ 版本号来自 app/build.gradle.kts（PR 里改版本号即发新版）
#       ├─ 版本号未变时自动追加构建序号（v1.4.2 → v1.4.2.1…）
#       │   且 versionCode 自动递增 —— 客户端永远能收到更新
#       └─ 双推防重：`git push origin main vX.Y.Z` 只发一次（同 commit 去重）
#
#   push tag v*.*.*（兼容旧习惯）→ 与 main 触发走同一决策链
#   workflow_dispatch → 干跑：完整构建 + 工件上传，不对外发布
#
#   构建 APK（universal + arm64，复用 apk.yml 的成熟路径）
#       ├─ 生成 version.json（版本 / 下载地址 / SHA-256 / 补丁清单）
#       ├─ 与上一版本生成 xdelta3 增量补丁（App「关于 → 检查更新」可选增量更新）
#       ├─ 累积维护 patches.json 补丁全量索引（App 跨版本链式增量的数据源）
#       └─ 双落点发布（产物在两个仓库都可直接下载）：
#             ├─ 发布仓库 Android-Guru-Agent-Release（跨仓库 PAT RELEASE_REPO_TOKEN）：
#             │     创建 Release + 上传 APK / 补丁 / version.json
#             │     + 提交 version.json 到 main 分支（App 内检查更新读取）
#             └─ 开发仓库 Android-Guru-Agent（默认 GITHUB_TOKEN）：
#                   镜像创建同 tag Release —— 软件在本仓库同样可下载
#
# 设计要点：
#   • 全局串行（concurrency release-pipeline）：发布天然互斥，也保证
#     resolve 阶段的"同 commit 去重"判断不被并发竞态击穿。
#   • 版本决策前置（resolve job）：40 秒内判出版本/跳过，避免 45 分钟
#     构建后才发现重复发布。
#   • 本仓库（dev）只用默认 GITHUB_TOKEN 做只读 checkout —— 跨仓库写操作
#     全部走 PAT。
# ═════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main      # PR 合并 / 直推 main → 自动发布
    tags:
      - 'v*.*.*'  # 手动打 tag → 同样发布（兼容既有习惯）
  workflow_dispatch: {}

concurrency:
  # 全局单队列：发布不互相取消，排队串行 —— 决策阶段查重才可靠
  group: release-pipeline
  cancel-in-progress: false

env:
  RELEASE_REPO: AceGuru-mjh/Android-Guru-Agent-Release
  DEV_REPO: AceGuru-mjh/Android-Guru-Agent

jobs:
  # ── 阶段一：版本决策（约 40s）──────────────────────────────────────────────
  # 在长构建之前判出：最终 tag / versionCode / 是否重复发布（skip）
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vcode: ${{ steps.meta.outputs.vcode }}
      tag: ${{ steps.meta.outputs.tag }}
      sha8: ${{ steps.meta.outputs.sha8 }}
      publishing: ${{ steps.meta.outputs.publishing }}
      skip: ${{ steps.meta.outputs.skip }}
      # 热更通道（v1.4.7）：上一版 commit / versionCode —— build 阶段
      # data-only 判定的比对基准（旧清单无 commitSha 时为空 → 本次不出热更包）
      prevSha: ${{ steps.meta.outputs.prev_sha }}
      prevVcode: ${{ steps.meta.outputs.prev_vcode }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify release credentials (fail fast)
        if: github.event_name == 'push'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_REPO_TOKEN secret 未配置（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $RELEASE_TOKEN" \
            "https://api.github.com/repos/${RELEASE_REPO}")
          if [ "$CODE" != "200" ]; then
            echo "::error::TOKEN 无法访问 ${RELEASE_REPO}（HTTP $CODE）—— 检查 PAT 仓库授权范围"
            exit 1
          fi
          echo "✅ RELEASE_REPO_TOKEN 可访问发布仓库 ${RELEASE_REPO}"

      - name: Resolve version metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # 提取模式适配 build.gradle.kts 的 CI 注入语法：
          #   versionName = (project.findProperty("apexVersionName") as String?) ?: "1.4.2"
          #   versionName：行内最后一个带引号串（源码默认值）；versionCode：= 后首个数字
          # v1.4.8 加固：先剥离 // 注释行再提取 —— 注释里出现「versionCode 等号数字」
          # 字样时 grep 会输出多行，多行值写入 GITHUB_OUTPUT 以 Invalid format
          # 直接炸掉 resolve（v1.4.8 首跑事故：版本注释与代码行双匹配）。
          GRADLE_SRC=$(grep -v '^[[:space:]]*//' app/build.gradle.kts)
          BASE=$(grep -oP 'versionName\s*=.*"\K[^"]+' <<<"$GRADLE_SRC" | head -1)
          VCODE_GRADLE=$(grep -oP 'versionCode\s*=[^0-9]*\K[0-9]+' <<<"$GRADLE_SRC" | head -1)
          if [ -z "$BASE" ] || [ -z "$VCODE_GRADLE" ]; then
            echo "::error::无法从 app/build.gradle.kts 提取 versionName/versionCode"
            exit 1
          fi
          SHA8=$(echo "${{ github.sha }}" | cut -c1-8)
          PUBLISHING=$([[ "$GITHUB_EVENT_NAME" == "push" ]] && echo true || echo false)
          SKIP=false

          # 上一版 versionCode —— 客户端比对真相源（raw CDN 即 App 检查更新的读取点）
          LAST_VCODE=$(curl -sf -H "Cache-Control: no-cache" \
            "https://raw.githubusercontent.com/${RELEASE_REPO}/main/version.json" \
            2>/dev/null | jq -r '.versionCode // 0' || echo 0)
          [ -n "$LAST_VCODE" ] || LAST_VCODE=0

          # ── versionCode 防撞号兜底 ──────────────────────────────────────
          # main 清单可能滞后于实际发布：某次 run 的「清单提交」步骤失败/被跳过
          # 时（v1.4.7.25 断链事故即此情形 —— 镜像 404 连累清单提交，main 卡在
          # v1.4.7.24），下一次发布的 resolve 读到旧值，两个版本撞同一
          # versionCode（.25/.26 双 72），先发版本的用户对后发版本永远判
          # 「已是最新」。这里对账 releases/latest（publish 步骤 make_latest: true
          # 恒指向最新发布）挂载的 version.json 资产，取两者最大值 ——
          # 清单滞后时不再撞号。上例中 .26 的 resolve 会读到 .25 的 72 →
          # 本次发 73，撞号在源头消失。
          REL_ASSET_URL=$(gh api "repos/${RELEASE_REPO}/releases/latest" \
            --jq '.assets[] | select(.name == "version.json") | .browser_download_url' \
            2>/dev/null || true)
          if [ -n "$REL_ASSET_URL" ]; then
            REL_VCODE=$(curl -sfL "$REL_ASSET_URL" 2>/dev/null \
              | jq -r '.versionCode // 0' 2>/dev/null || echo 0)
            case "$REL_VCODE" in ''|*[!0-9]*) REL_VCODE=0;; esac
            if [ "$REL_VCODE" -gt "$LAST_VCODE" ]; then
              echo "::notice::main 清单（v${LAST_VCODE}）落后于最新 Release 资产（v${REL_VCODE}）—— 以资产为准防撞号"
              LAST_VCODE="$REL_VCODE"
            fi
          fi

          # 上一版 commit —— 热更通道 data-only 判定基准（v1.4.7：
          # build 阶段用 compare API 比对 PREV_SHA...HEAD 的变更集，
          # 全部落在热载路径白名单才出热更包；旧清单无 commitSha → 空，
          # 本次不出热更包 —— 热更通道从首个携带 commitSha 的版本起自举）
          PREV_SHA=$(curl -sf -H "Cache-Control: no-cache" \
            "https://raw.githubusercontent.com/${RELEASE_REPO}/main/version.json" \
            2>/dev/null | jq -r '.commitSha // empty' || echo "")

          release_body() {
            gh api "repos/${RELEASE_REPO}/releases/tags/$1" --jq .body 2>/dev/null || true
          }

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # ── tag 触发：tag 必须与源码 versionName 一致（fail fast）──────
            TAG="$GITHUB_REF_NAME"
            if [ "v$BASE" != "$TAG" ]; then
              echo "::error::tag($TAG) 与 versionName(v$BASE) 不一致 —— 先改 app/build.gradle.kts 再打 tag"
              exit 1
            fi
            VERSION="$BASE"
            # 双推防重：main 队列的 run 可能已发布同 commit（release body 内嵌 sha8）
            if grep -q "$SHA8" <<<"$(release_body "$TAG")"; then
              SKIP=true
              echo "⏭️  ${TAG} 已由同 commit（${SHA8}）的流水线发布 —— 跳过重复构建"
            fi
          elif [ "$PUBLISHING" = true ]; then
            # ── main push（PR 合并/直推）：自动版本决策 ──────────────────────
            TAG="v$BASE"
            VERSION="$BASE"
            if gh api "repos/${RELEASE_REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
              if grep -q "$SHA8" <<<"$(release_body "$TAG")"; then
                # tag 队列的 run 已/将发布同 commit —— 本 run 无事可做
                SKIP=true
                echo "⏭️  ${TAG} 已由同 commit（${SHA8}）的流水线发布 —— 跳过重复构建"
              else
                # 同版本号重发：自动追加构建序号（v1.4.2 → v1.4.2.1 → …）
                N=1
                while gh api "repos/${RELEASE_REPO}/releases/tags/v${BASE}.${N}" >/dev/null 2>&1; do
                  N=$((N + 1))
                done
                TAG="v${BASE}.${N}"
                VERSION="${BASE}.${N}"
                echo "⚠️  v${BASE} 已被占用 —— 本次自动升级为 ${TAG}"
                echo "::notice::建议在 PR 中更新 app/build.gradle.kts 的 versionName/versionCode"
              fi
            fi
          else
            # ── 干跑（workflow_dispatch）：信息性 tag，不对外发布 ─────────────
            TAG="v$BASE"
            VERSION="$BASE"
          fi

          # versionCode 守卫：绝不回退 —— 忘 bump 时自动 = 上一版 + 1，
          # 保证客户端（versionCode 比对）始终能收到更新
          VCODE="$VCODE_GRADLE"
          if [ "$VCODE" -le "$LAST_VCODE" ]; then
            VCODE=$((LAST_VCODE + 1))
            echo "⚠️  versionCode($VCODE_GRADLE) ≤ 上一版($LAST_VCODE) —— 自动提升为 $VCODE"
          fi

          {
            echo "version=$VERSION"
            echo "vcode=$VCODE"
            echo "sha8=$SHA8"
            echo "tag=$TAG"
            echo "publishing=$PUBLISHING"
            echo "skip=$SKIP"
            echo "prev_sha=${PREV_SHA:-}"
            echo "prev_vcode=${LAST_VCODE}"
          } >> "$GITHUB_OUTPUT"
          echo "🏷️  $TAG（versionName=$VERSION versionCode=$VCODE ← gradle $VCODE_GRADLE / 上版 $LAST_VCODE）sha8=$SHA8 publishing=$PUBLISHING skip=$SKIP"

      - name: Summary (resolve)
        if: always()
        run: |
          {
            echo "### 🧭 版本决策"
            echo ""
            echo "- 事件: ${{ github.event_name }} @ ${{ github.ref_name }}"
            echo "- 目标: **${{ steps.meta.outputs.tag }}**（versionCode ${{ steps.meta.outputs.vcode }} · ${{ steps.meta.outputs.sha8 }}）"
            if [ "${{ steps.meta.outputs.skip }}" = "true" ]; then
              echo "- 结论: ⏭️ **跳过**（该版本已由同 commit 的流水线发布，无需重复构建）"
            elif [ "${{ steps.meta.outputs.publishing }}" = "true" ]; then
              echo "- 结论: 🚀 排队进入构建发布"
            else
              echo "- 结论: 🧪 干跑（仅构建与工件，不对外发布）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 阶段二：构建 + 发布（约 10 分钟）──────────────────────────────────────
  build-and-publish:
    name: Build & Publish ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 双构建 + 10 基底多补丁生成（每基底需下载历史 APK + xdelta3），
    # 公开仓库 Actions 分钟免费 —— 充裕超时优先于失败重跑
    timeout-minutes: 150
    permissions:
      # 本仓库 Release 镜像发布需要写权限（默认 GITHUB_TOKEN）；
      # 跨仓库（发布仓库）写操作仍全部走 PAT（RELEASE_REPO_TOKEN）
      contents: write
    defaults:
      run:
        # bashisms 依赖：[[ ]] / ${VAR^} / 算术展开 —— runner 默认 sh(dash) 不支持
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # 浏览器库 composite build 检出（actions/checkout 禁止越出 workspace，
      # 用嵌套路径 apex-browser-kit —— settings.gradle.kts 的嵌套兜底分支命中；
      # 本地开发仍是兄弟目录 ../apex-browser-kit，两种布局等价）
      # —— 拆库 E1 迁移期：app 依赖 com.apex.browser:{core,engine,chrome}，
      #    composite build 自动替换为本地构建；远端坐标待 E3 发布后启用。
      - name: Read apex-browser-kit pin
        id: bkitpin
        # 锁定文件 gradle/browser-kit.lock 由 sync-browser-kit 工作流自动维护：
        # browser-kit main 有新绿提交 → 锁文件 bump → 本仓库 push → 发布流水线
        # 以锁定版本构建（可复现、防供应链漂移）。缺锁回退 main。
        run: |
          set -euo pipefail
          PIN=$(head -n 1 gradle/browser-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"
      - name: Checkout apex-browser-kit (browser-kit composite build, pinned)
        uses: actions/checkout@v4
        with:
          repository: AceGuru-mjh/apex-browser-kit
          ref: ${{ steps.bkitpin.outputs.sha }}
          path: apex-browser-kit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # NDK 27.0.12077973 由 :terminal-native / :core:code-native 显式 ndkVersion 钉版
          #（AGP 8.13.2 时代防默认 NDK 漂移到 28.x）。sdkmanager 偶发半截安装
          #（目录在、source.properties 缺失 → CXX1101 硬失败，2026-10-05 run
          # 37327280591 实测：pull_request run 翻车而同 SHA 的 push run 通过，
          # 纯 runner 环境差异）。三重防线（与 apk.yml / #330 对齐）：
          #   1) 完整性校验先行：已完好则零开销跳过；
          #   2) sdkmanager 安装后校验，坏了立即清掉重试；
          #   3) 仍失败 → dl.google.com 官方 zip 直下兜底（免许可/免鉴权/稳定）。
          #   绝不静默留下损坏目录 —— 那比没有更糟（AGP 按版本号命中坏目录）。
          NDK_VER="27.0.12077973"
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VER"
          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "✅ NDK $NDK_VER 已就绪（缓存命中）"
          else
            rm -rf "$NDK_DIR"
            NDK_OK=0
            for ATTEMPT in 1 2; do
              if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                  --install "ndk;$NDK_VER" >/dev/null 2>&1 && \
                 [ -f "$NDK_DIR/source.properties" ]; then
                NDK_OK=1; break
              fi
              rm -rf "$NDK_DIR"
              sleep 5
            done
            if [ "$NDK_OK" != "1" ]; then
              echo "⚠️ sdkmanager 安装 NDK 失败 —— dl.google.com 官方 zip 直下兜底"
              rm -rf "$NDK_DIR" /tmp/ndk-r27.zip /tmp/ndk-extract
              curl -sfL --retry 3 -o /tmp/ndk-r27.zip \
                "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
              unzip -q /tmp/ndk-r27.zip -d /tmp/ndk-extract
              mkdir -p "$ANDROID_HOME/ndk"
              mv /tmp/ndk-extract/android-ndk-r27 "$NDK_DIR"
            fi
            [ -f "$NDK_DIR/source.properties" ] \
              && echo "✅ NDK $NDK_VER 就绪" \
              || { echo "::error::NDK $NDK_VER 安装失败（sdkmanager 与直下均不可用）"; exit 1; }
          fi
          ls "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK pre-installed"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14

      - name: Stage bundled Ubuntu rootfs (T83 内置交付)
        run: |
          # T83/T84：Ubuntu rootfs 随 APK 内置。构建期拉取 → 双重 SHA-256 校验 →
          # 暂存为 jniLibs 伪 .so。失败即阻断构建（绝不打包指纹不符的 rootfs）。
          scripts/fetch_rootfs.sh

      - name: Prewarm dependencies (retry on JitPack flakiness)
        run: |
          attempts=5
          for i in $(seq 1 $attempts); do
            if ./gradlew :app:dependencies \
                --configuration debugCompileClasspath \
                --write-locks \
                --stacktrace; then
              echo "✅ Dependency resolution succeeded on attempt $i"
              exit 0
            fi
            echo "⚠️ Dependency resolution attempt $i failed, retrying..."
            sleep $((i * 30))
          done
          echo "❌ Dependency resolution failed after $attempts attempts"
          exit 1

      # 版本注入：resolve 阶段可能自动追加了构建序号（v1.4.2.1）或提升了
      # versionCode —— 经 Gradle 属性注入最终值，不回写仓库文件（源码保持干净）。
      - name: Build APK (universal + arm64, version injected)
        env:
          FINAL_VERSION: ${{ needs.resolve.outputs.version }}
          FINAL_VCODE: ${{ needs.resolve.outputs.vcode }}
        run: |
          echo "🚀 Building release APKs with versionName=$FINAL_VERSION versionCode=$FINAL_VCODE"
          # 与 apk.yml 相同的双产物路径（中间产物必须停在任务输出目录之外 ——
          # Gradle 重跑 packageRelease 会把输出目录里的非本轮产物当 stale 清理）：
          #   先 universal（含全 3 ABI rootfs，兼容旧设备/模拟器），
          #   再 arm64 纯净包（-PapexAbi 收窄 app 级 abiFilters）。
          ./gradlew ":app:assembleRelease" \
            -PapexVersionName="$FINAL_VERSION" \
            -PapexVersionCode="$FINAL_VCODE" \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/app-universal-release.apk
          ./gradlew ":app:assembleRelease" \
            -PapexVersionName="$FINAL_VERSION" \
            -PapexVersionCode="$FINAL_VCODE" \
            -PapexAbi=arm64-v8a \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/app-arm64-release.apk

          # ── 网页自动化插件 APK（v1.4.9 插件分发链路）────────────────
          # 与宿主同 keystore 签名（插件 build.gradle.kts 的 signingConfigs.release）
          # —— PluginManager 签名门比对通过，侧载安装后「市场 → 插件」页
          # 自动发现并加载 browser_* 工具清单。此前 CI 只构建 :app，插件
          # 从未产出 → 插件页永远显示「未发现插件」，本次补齐分发链路。
          ./gradlew ":plugins:plugin-web-automation:assembleRelease" \
            -PapexVersionName="$FINAL_VERSION" \
            --no-daemon \
            -Pkotlin.incremental=false \
            --stacktrace

      - name: Stage artifacts + checksums
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SHA8: ${{ needs.resolve.outputs.sha8 }}
        run: |
          mkdir -p dist
          mv app/build/outputs/apk/app-arm64-release.apk \
             "dist/ApexAgent-v${VERSION}-release-arm64-${SHA8}.apk"
          mv app/build/outputs/apk/app-universal-release.apk \
             "dist/ApexAgent-v${VERSION}-release-universal-${SHA8}.apk"
          # 插件 APK 入产物集（随 files: dist/* 发布仓库 + dist/*.apk 主仓镜像
          # 自动带走；SHA 清单同批覆盖）
          PLUGIN_APK=$(ls plugins/plugin-web-automation/build/outputs/apk/release/*.apk | head -1)
          mv "$PLUGIN_APK" "dist/ApexWebAutomationPlugin-v${VERSION}.apk"
          cd dist
          sha256sum ./*.apk | tee SHA256SUMS.apk
          ARM64_MB=$(du -m *arm64*.apk | cut -f1)
          UNI_MB=$(du -m *universal*.apk | cut -f1)
          PLUGIN_KB=$(du -k *WebAutomationPlugin*.apk | cut -f1)
          echo "📦 arm64 — ${ARM64_MB} MB | universal — ${UNI_MB} MB | plugin — ${PLUGIN_KB} KB"
          {
            echo "### 📦 发布产物"
            echo ""
            echo "- arm64: **${ARM64_MB} MB**（arm64-v8a，现代手机首选）"
            echo "- universal: **${UNI_MB} MB**（全 3 ABI：旧设备 / 模拟器）"
            echo "- plugin: **${PLUGIN_KB} KB**（网页自动化插件，宿主同签名，侧载即被市场页发现）"
            echo ""
            echo '```'
            cat SHA256SUMS.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Extract signing certificate digest (signature pre-flight)"
        run: |
          set -euo pipefail
          # v1.4.8 起发布 APK 用**固定入库 keystore**（keystore/apex-release.jks，
          # 凭据 name=meng411722 / key=meng411722）签名 —— CI 与本地构建签名指纹
          # 恒定，增量更新合成的 APK 与已装 APK 签名一致，覆盖安装无冲突。
          # 本步骤提取证书 SHA-256 指纹注入 version.json.signingCertSha256，供
          # App 端签名预检（UpdateCenter.signatureMismatch）—— 客户端比对本地
          # 指纹，不一致时（旧版/分叉构建）提前劝导热更/卸载重装。
          APK=$(ls dist/*-arm64-*.apk | head -1)
          CERT_SHA=""
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            CERT_SHA=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
              | grep -ioE '[0-9a-f]{64}' | head -1 || true)
          fi
          if [ -z "$CERT_SHA" ]; then
            # keytool 兜底（v1-only 签名 / build-tools 异常）：输出形如
            # `SHA256: AB:CD:…`（冒号分隔）或 `SHA256: ABCD…`（无冒号）
            RAW=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -i 'SHA256:' | head -1 || true)
            CERT_SHA=$(echo "$RAW" | grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}' | head -1 | tr -d ':' || true)
            if [ -z "$CERT_SHA" ]; then
              CERT_SHA=$(echo "$RAW" | grep -oE '[0-9A-Fa-f]{64}' | head -1 || true)
            fi
            CERT_SHA=$(echo "$CERT_SHA" | tr 'A-F' 'a-f')
            [[ "$CERT_SHA" =~ ^[0-9a-f]{64}$ ]] || CERT_SHA=""
          fi
          mkdir -p meta
          if [ -n "$CERT_SHA" ]; then
            echo "$CERT_SHA" > meta/cert_sha256.txt
            echo "✅ 签名证书指纹：${CERT_SHA:0:16}…（注入 version.json.signingCertSha256）"
          else
            echo "⚠️ 指纹提取失败 —— version.json 缺 signingCertSha256（客户端预检退化为旧行为）"
          fi

      - name: "Generate hot update package (data-only releases)"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          VCODE: ${{ needs.resolve.outputs.vcode }}
          PREV_SHA: ${{ needs.resolve.outputs.prevSha }}
          PREV_VCODE: ${{ needs.resolve.outputs.prevVcode }}
        run: |
          set -euo pipefail
          mkdir -p meta
          # ── data-only 判定（v1.4.7 热更通道，见 docs/hot-update-pipeline.md）──
          # 比对「上一版 commit → 本版」变更集，全部落在热载路径白名单
          # （assets/skills 与 assets/mcp_catalog 下的 .json）才出热更包；
          # 任何白名单外变更 = 本版必须重装 APK，不出热更包（客户端走
          # 增量/全量 + 签名预检）。PREV_SHA 为空（旧清单无 commitSha /
          # 首版）→ 跳过，通道从首个携带 commitSha 的版本起自举。
          if [ -z "$PREV_SHA" ] || [ -z "$PREV_VCODE" ] || [ "$PREV_VCODE" = "0" ]; then
            echo "⏭️  上一版清单无 commitSha —— 热更通道自举起点，本次不出热更包"
            exit 0
          fi
          STATUS=$(gh api "repos/${DEV_REPO}/compare/${PREV_SHA}...${GITHUB_SHA}" \
            --jq '{truncated: .truncated, files: (.files // [] | map(.filename))}' \
            2>/dev/null || echo '{"truncated": true, "files": []}')
          TRUNCATED=$(echo "$STATUS" | jq -r '.truncated')
          FILES=$(echo "$STATUS" | jq -r '.files | join("\n")')
          if [ "$TRUNCATED" = "true" ]; then
            echo "⚠️  compare 截断（>300 文件）—— 保守起见按含代码变更处理，不出热更包"
            exit 0
          fi
          if [ -n "$FILES" ]; then
            OFFENDING=$(echo "$FILES" | grep -vE '^app/src/main/assets/(skills|mcp_catalog)/[^/]+\.json$' || true)
            if [ -n "$OFFENDING" ]; then
              echo "🚫 本版含非热载路径变更 —— 必须重装 APK，不出热更包。白名单外文件（前 20）："
              echo "$OFFENDING" | head -20 | sed 's/^/    - /'
              exit 0
            fi
            echo "✅ data-only 判定通过（$(echo "$FILES" | wc -l) 个文件全部在热载白名单）"
          else
            echo "ℹ️  无文件变更（同 commit 重发版）—— 按 data-only 处理（幂等热更）"
          fi
          # ── 打包：hotmanifest.json + skills 目录 + mcp_catalog 目录 ────────
          python3 - <<'PYEOF'
          import hashlib, json, os, zipfile

          version, vcode = os.environ["VERSION"], int(os.environ["VCODE"])
          tag = os.environ["TAG"]

          # 热通道能力地板：首个携带热更通道客户端的 versionCode（v1.4.7）。
          # base 取地板而非上一版 —— 热更包是**累积快照**（skills + 目录全量，
          # 自包含），对任何热通道客户端皆可安全应用；而签名冲突用户（本通道的
          # 主要服务对象）**永远无法重装 APK**，若 base 随版本推进，他们跳过
          # 一次发版就会被永久锁在数据通道之外。地板以下的老客户端本就不认识
          # hot 字段（ignoreUnknownKeys），不受影响。
          HOT_FLOOR_VCODE = 49

          def sha256_bytes(data):
              return hashlib.sha256(data).hexdigest()

          entries = []
          hot_root = "dist-hot"
          # 包内布局与 APK 热载路径同构：skills/<id>.json + mcp_catalog/<cat>.json
          for section in ("skills", "mcp_catalog"):
              src = f"app/src/main/assets/{section}"
              if not os.path.isdir(src):
                  continue
              for name in sorted(os.listdir(src)):
                  if not name.endswith(".json"):
                      continue
                  data = open(os.path.join(src, name), "rb").read()
                  rel = f"{section}/{name}"
                  os.makedirs(os.path.join(hot_root, section), exist_ok=True)
                  open(os.path.join(hot_root, rel), "wb").write(data)
                  entries.append({"path": rel, "sha256": sha256_bytes(data)})

          manifest = {
              "schema": "apex-hot-v1",
              "targetVersionCode": vcode,
              "targetVersionName": version,
              "entries": entries,
          }
          with open(os.path.join(hot_root, "hotmanifest.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")

          # dist/ 只放对外产物 —— 热更包 zip 进 dist/（发布步骤 files: dist/* 自动带走）
          zip_path = f"dist/hot_v{version}.zip"
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for root, _, files in os.walk(hot_root):
                  for name in sorted(files):
                      full = os.path.join(root, name)
                      zf.write(full, os.path.relpath(full, hot_root))
          size_kb = os.path.getsize(zip_path) // 1024
          print(f"📦 热更包：{zip_path}（{len(entries)} 文件，{size_kb} KB）")

          # meta/hot_meta.json —— version.json 注入源（base = 热通道能力地板）
          meta = {"file": f"hot_v{version}.zip", "baseVersionCode": HOT_FLOOR_VCODE,
                  "targetVersionCode": vcode, "targetVersionName": version}
          with open("meta/hot_meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False)
              f.write("\n")
          PYEOF
          rm -rf dist-hot
          {
            echo ""
            echo "### 🔥 热更包（data-only · 免安装）"
            echo ""
            echo "- \`hot_v${VERSION}.zip\` — $(($(stat -c%s "dist/hot_v${VERSION}.zip") / 1024)) KB"
            echo "- 适用基底：所有支持热更通道的版本（v1.4.7+，App 内自动判定，下载后即时生效）"
            echo "- 签名冲突用户（本地/分叉构建）可持续乘此通道追平数据层，无需重装"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Generate xdelta3 patches (multi-base: semantic window → this release)"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xdelta3 >/dev/null
          # ── 多基底补丁（v1.4.8：跨十个版本内一步直达）────────────────────
          # 对最近 PATCH_BASES 个版本各出一份单跳补丁：窗口内任意版本 →
          # 本版一步到位（rootfs 不变时补丁体积与相邻版相当，~16MB 级）。
          # 窗口外的老版本仍可用 patches.json 的链式路径，再老就回退全量包。
          #
          # ⚠️ 历史教训（本次修复的根因）：基底选取曾依赖 Releases API 的
          # 返回顺序，而该顺序不保证语义版本序 —— 实测 v1.4.7.10 出现在
          # 列表第 7 位，导致 v1.4.7.11 发布时基底窗口（当时取前 3）跳过
          # 了相邻版本 v1.4.7.10，其出边为零 → 该版本用户永久断链（只能
          # 全量）。现在改为拉全量后 sort -rV 语义降序，相邻版本永远在窗口
          # 首位；正则兼容任意多段 tag（自动构建序号版 v1.4.2.1 / 五段
          # 极端情形），公开仓库 Actions 分钟免费 —— 窗口从 3 扩到 10。
          PATCH_BASES="${PATCH_BASES:-10}"
          list_base_tags() {
            local repo="$1"
            # 语义版本降序（sort -rV）：v1.4.7.10 > v1.4.7.9 > v1.4.7 ——
            # 绝不信 API 返回顺序（它按 release 对象创建时间而非版本号排）
            gh api "repos/$repo/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null \
              | grep -E '^v[0-9]+(\.[0-9]+)+$' | grep -v "^${TAG}$" \
              | sort -rV | head -"$PATCH_BASES" || true
          }
          BASES=$(list_base_tags "$RELEASE_REPO")
          BASE_SRC="${RELEASE_REPO}"
          if [ -z "$BASES" ]; then
            BASES=$(list_base_tags "$DEV_REPO")
            BASE_SRC="${DEV_REPO}"
          fi
          if [ -z "$BASES" ]; then
            echo "⚠️ 未找到历史版本 release —— 跳过补丁生成（首版正常）"
            exit 0
          fi
          # 首个基底 = 上一版（primary：进 version.json 的单补丁档，兼容老客户端）
          PRIMARY_BASE=$(echo "$BASES" | head -1)
          echo "🔗 基底窗口（来源 ${BASE_SRC}，共 $(echo "$BASES" | wc -l) 个）："
          echo "$BASES" | sed 's/^/    - /'
          # meta/ 存内部工作文件（不进 Release 资产）；dist/ 只放对外产物
          # TSV 四列：variant | fromTag | patch 文件名 | primary(1=上一版)
          mkdir -p prev meta
          : > meta/patch_meta.tsv
          for BASE in $BASES; do
            for VARIANT in arm64 universal; do
              NEW_APK=$(ls dist/*-${VARIANT}-*.apk | head -1)
              # 下载基底包 → 出补丁 → 立即删基底（universal ~900MB，磁盘峰值控制）
              rm -f prev/*.apk
              gh release download "$BASE" --repo "$BASE_SRC" \
                --pattern "*-${VARIANT}-*.apk" --dir prev/ --clobber >/dev/null 2>&1 || true
              BASE_APK=$(ls prev/*-${VARIANT}-*.apk 2>/dev/null | head -1 || true)
              if [ -z "$BASE_APK" ]; then
                echo "⚠️ ${BASE} 无 ${VARIANT} 资产 —— 跳过该补丁"
                continue
              fi
              PATCH_NAME="patch_${VARIANT}_${BASE}_to_${TAG}.vcdiff"
              echo "⚙️  xdelta3: ${BASE_APK} + ${NEW_APK} → ${PATCH_NAME}"
              # 显式 -S lzma：与 App 内 VcdiffDecoder 的支持面对齐（Ubuntu 发行版
              # 默认即 lzma，但显式化可免 runner 升级后的行为漂移）；不支持时回退
              # 无二级压缩的原生 VCDIFF（App 同样可解码，体积略大）
              if ! xdelta3 -e -f -S lzma -s "$BASE_APK" "$NEW_APK" "dist/${PATCH_NAME}"; then
                echo "⚠️ -S lzma 不可用（${VARIANT}）—— 回退无二级压缩"
                if ! xdelta3 -e -f -s "$BASE_APK" "$NEW_APK" "dist/${PATCH_NAME}"; then
                  echo "⚠️ xdelta3 失败（${VARIANT}）—— 跳过该补丁"
                  continue
                fi
              fi
              # 补丁体积守卫：> 60% 新包即无意义（rootfs 大改时直接下全量）
              NEW_SIZE=$(stat -c%s "$NEW_APK")
              PATCH_SIZE=$(stat -c%s "dist/${PATCH_NAME}")
              if (( PATCH_SIZE * 10 > NEW_SIZE * 6 )); then
                echo "🗑️  补丁 ${PATCH_SIZE}B > 60% 新包 ${NEW_SIZE}B —— 丢弃（不发布）"
                rm -f "dist/${PATCH_NAME}"
                continue
              fi
              PRIMARY_FLAG=0
              if [ "$BASE" = "$PRIMARY_BASE" ]; then PRIMARY_FLAG=1; fi
              echo -n "${VARIANT}|${BASE}|${PATCH_NAME}|${PRIMARY_FLAG}" >> meta/patch_meta.tsv
              echo "" >> meta/patch_meta.tsv
              echo "✅ ${PATCH_NAME} — $((PATCH_SIZE / 1024 / 1024)) MB（$((PATCH_SIZE * 100 / NEW_SIZE))% of ${VARIANT}）"
            done
          done
          rm -rf prev
          # 补丁说明进 Job Summary
          if [ -s meta/patch_meta.tsv ]; then
            {
              echo ""
              echo "### 🔧 增量补丁（多基底 → ${TAG}）"
              while IFS='|' read -r VARIANT FROM NAME PRIMARY; do
                MARK=""
                if [ "$PRIMARY" = "1" ]; then MARK="（上一版 · primary）"; fi
                echo "- \`${NAME}\` — $(( $(stat -c%s "dist/${NAME}") / 1024 / 1024 )) MB${MARK}"
              done < meta/patch_meta.tsv
              echo ""
              echo "窗口内任意版本可单跳升级到本版；更早版本由 patches.json 链式增量覆盖。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate version.json + release body
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          VCODE: ${{ needs.resolve.outputs.vcode }}
          SHA8: ${{ needs.resolve.outputs.sha8 }}
          SHA_FULL: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import datetime, hashlib, json, os

          tag, version, vcode = os.environ["TAG"], os.environ["VERSION"], int(os.environ["VCODE"])
          sha8, repo = os.environ["SHA8"], os.environ["RELEASE_REPO"]
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          def asset(fname):
              return {"url": f"{base}/{fname}",
                      "sizeBytes": os.path.getsize(f"dist/{fname}"),
                      "sha256": sha256(f"dist/{fname}")}

          arm64 = asset(f"ApexAgent-v{version}-release-arm64-{sha8}.apk")
          universal = asset(f"ApexAgent-v{version}-release-universal-{sha8}.apk")

          # 插件 APK 档（v1.4.9）：供未来 App 内插件下载/升级使用；老客户端
          # ignoreUnknownKeys 自动忽略。dist 缺文件时为 None（热更等极小路径）。
          plugin_apk = f"ApexWebAutomationPlugin-v{version}.apk"
          plugin = None
          if os.path.exists(f"dist/{plugin_apk}"):
              plugin = {"id": "com.apex.agent.plugin.webautomation",
                       "name": "网页自动化",
                       "minHostVersion": 1,
                       **asset(plugin_apk)}

          # 单补丁档只收 primary（上一版 → 本版）——老客户端 schema 兼容；
          # 多基底单跳补丁全部走 patches.json（新客户端按索引直选/短路）。
          patch = None
          if os.path.exists("meta/patch_meta.tsv") and os.path.getsize("meta/patch_meta.tsv") > 0:
              patch = {}
              with open("meta/patch_meta.tsv") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split("|")
                      # 四列：variant | fromTag | fname | primary（旧三列兼容）
                      variant, from_tag, fname = parts[0], parts[1], parts[2]
                      primary = parts[3] if len(parts) > 3 else "1"
                      if primary != "1":
                          continue
                      patch[variant] = {"fromTag": from_tag,
                                        "url": f"{base}/{fname}",
                                        "sizeBytes": os.path.getsize(f"dist/{fname}"),
                                        "sha256": sha256(f"dist/{fname}")}

          manifest = {
              "versionName": version,
              "versionCode": vcode,
              "tag": tag,
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "releasePage": f"https://github.com/{repo}/releases/tag/{tag}",
              "download": {"arm64": arm64, "universal": universal},
              "plugin": plugin,
              "patch": patch,
          }

          # ── 热更通道字段（v1.4.7，老客户端 ignoreUnknownKeys 自动忽略）──
          # hot：data-only 版本的热更包档（App 零安装通道）；
          # commitSha：本版 commit（下一版 data-only 判定的比对基准，通道自举）；
          # signingCertSha256：发布 APK 签名证书指纹（客户端签名预检）。
          if os.path.exists("meta/hot_meta.json"):
              hm = json.load(open("meta/hot_meta.json"))
              fname = hm["file"]
              manifest["hot"] = {
                  "baseVersionCode": hm["baseVersionCode"],
                  "targetVersionCode": hm["targetVersionCode"],
                  "targetVersionName": hm.get("targetVersionName", version),
                  "url": f"{base}/{fname}",
                  "sizeBytes": os.path.getsize(f"dist/{fname}"),
                  "sha256": sha256(f"dist/{fname}"),
              }
          manifest["commitSha"] = os.environ.get("SHA_FULL")
          if os.path.exists("meta/cert_sha256.txt"):
              cert = open("meta/cert_sha256.txt").read().strip()
              if len(cert) == 64:
                  manifest["signingCertSha256"] = cert

          with open("dist/version.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(json.dumps(manifest, indent=2, ensure_ascii=False))

          # ── Release body（与 version.json 同源，避免两处手抄漂移）──
          # 行列表而非三引号多行串：块标量内 0 列文本会撕裂 YAML 结构。
          # 双落点双份 body：发布仓库（只存产物）与开发仓库（源码主页，镜像发布）。
          mb = lambda a: a["sizeBytes"] / 1024 / 1024
          # 发布页补丁清单：多基底全量列出（文件名即基底信息，用户可辨识）
          patch_lines = "无（首次发布或 rootfs 大改）"
          if os.path.exists("meta/patch_meta.tsv") and os.path.getsize("meta/patch_meta.tsv") > 0:
              rows = []
              with open("meta/patch_meta.tsv") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split("|")
                      variant, from_tag, fname = parts[0], parts[1], parts[2]
                      size_mb = os.path.getsize(f"dist/{fname}") // 1024 // 1024
                      rows.append(f"- `{variant}`: {from_tag} → {tag} — {size_mb} MB（xdelta3 VCDIFF）")
              if rows:
                  patch_lines = "\n".join(rows)

          def release_body(header_note):
              # 热更段：data-only 版本展示免安装通道（否则说明本版需重装）
              if "hot" in manifest and manifest["hot"]:
                  h = manifest["hot"]
                  hot_lines = "\n".join([
                      "### 🔥 Hot update (data-only · no install needed)",
                      "",
                      f"- `hot_v{version}.zip` — {h['sizeBytes'] // 1024} KB（skills / MCP 目录数据层快照）",
                      f"- 适用基底：versionCode ≥ {h['baseVersionCode']} —— App 内自动判定，下载后即时生效",
                      f"- 与 APK 签名无关：本地构建 / 分叉构建同样可用（不受签名冲突影响）",
                      "",
                  ])
              else:
                  hot_lines = ""
              # 插件段（v1.4.9）：插件 APK 与宿主同 keystore 签名，侧载安装后
              # 「市场 → 插件」页自动发现并加载 browser_* 工具。
              if manifest.get("plugin"):
                  p = manifest["plugin"]
                  plugin_lines = "\n".join([
                      "### 🧩 插件（网页自动化）",
                      "",
                      f"- `ApexWebAutomationPlugin-v{version}.apk` — {p['sizeBytes'] // 1024} KB",
                      "- 与宿主同签名：安装后宿主「市场 → 插件」页自动发现并加载 browser_* 工具（导航/快照/点击/输入等 15 项）",
                      "- 首次使用侧载安装一次即可；后续版本同签名可无冲突覆盖升级",
                      "",
                  ])
              else:
                  plugin_lines = ""
              return "\n".join([
                  f"## Apex Agent {tag}",
                  "",
                  header_note,
                  "",
                  "### 📦 下载（选适合你设备的）",
                  "| 变体 | 适用 | 体积 |",
                  "| --- | --- | --- |",
                  f"| `arm64` | 现代手机（arm64-v8a，**首选**） | {mb(arm64):.0f} MB |",
                  f"| `universal` | 旧设备 / 模拟器（全 3 ABI） | {mb(universal):.0f} MB |",
                  "",
                  plugin_lines,
                  hot_lines,
                  "### 🔧 增量补丁（App 内「关于 → 检查更新」可直选）",
                  patch_lines,
                  "",
                  "应用方式：App 内「关于 → 检查更新」下载补丁后**自动合成并拉起安装**",
                  "（v1.4.5+ 内置 VCDIFF 解码器，无需命令行；窗口内版本单跳直达，",
                  "更早版本自动链式应用）。",
                  "",
                  "### 📋 版本清单",
                  "`version.json` —— App 内「关于 → 检查更新」即读取此文件（含 SHA-256 校验）。",
                  "",
                  "> Ubuntu 24.04 完整 CLI 环境随 APK 内置 —— 首次离线解包约 2~5 分钟，零网络。",
                  f"> 提交：`{os.environ['SHA8']}` · versionCode：`{vcode}`",
                  "",
              ])

          body = release_body(
              "> 开发仓库合并 PR / 打 tag 自动构建，跨仓库 PAT 自动发布 —— 本仓库只存产物，\n"
              f"> 源码见 https://github.com/AceGuru-mjh/Android-Guru-Agent/tree/{tag}")
          body_dev = release_body(
              "> 本 Release 由流水线自动构建发布（PR 合并 / 打 tag 触发）。\n"
              f"> 产物与增量补丁的主存放处：https://github.com/{repo} —— App 内更新检查固定读取发布仓库。")

          with open("release_body.md", "w", encoding="utf-8") as f:
              f.write(body)
          with open("release_body_dev.md", "w", encoding="utf-8") as f:
              f.write(body_dev)
          PYEOF
          cat release_body.md

      - name: Generate patches.json (cumulative patch index)
        if: needs.resolve.outputs.publishing == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # 拉取现有索引（首版 / 历史缺失时从空开始）—— 跨版本链式增量的数据底座：
          # App 由此把「本地版本 → 最新版本」解析成补丁链逐段应用
          #
          # ⚠️ 索引走文件而非环境变量（v1.4.8.1 run 37553524502 事故）：
          # patches.json 随版本累积已过 131072 字节（MAX_ARG_STRLEN 单串上限），
          # 旧写法 export EXISTING_JSON 会让本步骤之后的所有 exec（jq / python3）
          # 一律 E2BIG「Argument list too long」直接炸步 —— 索引只增不减，
          # 该缺陷属「定时炸弹」：v1.4.8 在 357 条侥幸通过，377 条必炸。
          # 环境变量只携带文件路径，内容一律落盘。
          EXISTING_FILE=/tmp/existing_patches.json
          FETCH_OK=0
          if gh api "repos/${RELEASE_REPO}/contents/patches.json?ref=main" \
              --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null \
              > "$EXISTING_FILE" && [ -s "$EXISTING_FILE" ]; then
            FETCH_OK=1
          fi
          if [ "$FETCH_OK" != "1" ]; then
            # 区分「索引文件不存在」（404 → 从零构建合法）与「拉取异常」
            #（拒绝静默从零重建 —— 那会丢光既有索引边，制造大面积断链）
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${RELEASE_REPO}/contents/patches.json?ref=main")
            if [ "$CODE" = "200" ]; then
              echo "::error::补丁索引拉取异常（HTTP 200 但解码/校验失败）—— 拒绝从零重建（防丢洞），请重跑本工作流"
              exit 1
            fi
            echo "🆕 无现有 patches.json（HTTP $CODE）—— 从零构建"
            echo '{"patches": []}' > "$EXISTING_FILE"
          elif ! python3 -c "import json; json.load(open('$EXISTING_FILE'))" 2>/dev/null; then
            echo "::error::现有索引 JSON 解析失败（截断/损坏）—— 拒绝从零重建（防丢洞），请重跑本工作流"
            exit 1
          else
            echo "📥 已拉取现有补丁索引（$(jq '.patches | length' "$EXISTING_FILE") 条）"
          fi
          export EXISTING_PATCHES_FILE="$EXISTING_FILE"
          python3 - <<'PYEOF'
          import datetime, hashlib, json, os

          tag, repo = os.environ["TAG"], os.environ["RELEASE_REPO"]
          with open(os.environ["EXISTING_PATCHES_FILE"], encoding="utf-8") as f:
              patches = json.load(f).get("patches", [])

          base = f"https://github.com/{repo}/releases/download/{tag}"

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          added = 0
          if os.path.exists("meta/patch_meta.tsv"):
              with open("meta/patch_meta.tsv") as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split("|")
                      # 四列：variant | fromTag | fname | primary（旧三列兼容）
                      variant, from_tag, fname = parts[0], parts[1], parts[2]
                      # 幂等守卫：同 (variant, fromTag, toTag) 不重复追加
                      #（多基底补丁也在此索引累积 —— 窗口内任意版本单跳直达）
                      dup = any(
                          p.get("variant") == variant and
                          p.get("fromTag") == from_tag and
                          p.get("toTag") == tag
                          for p in patches
                      )
                      if dup:
                          continue
                      patches.append({
                          "variant": variant,
                          "fromTag": from_tag,
                          "toTag": tag,
                          "url": f"{base}/{fname}",
                          "sizeBytes": os.path.getsize(f"dist/{fname}"),
                          "sha256": sha256(f"dist/{fname}"),
                      })
                      added += 1

          manifest = {
              "generatedAt": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "latestTag": tag,
              "patches": patches,
          }
          with open("dist/patches.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"📦 patches.json：共 {len(patches)} 条（本次新增 {added}）")
          PYEOF

      - name: Upload workflow artifacts (backup / dry-run output)
        uses: actions/upload-artifact@v4
        with:
          name: release-dist-${{ needs.resolve.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release to release repository
        if: needs.resolve.outputs.publishing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # 关键：目标为发布仓库（owner/repo），token 为跨仓库 PAT —— 默认
          # GITHUB_TOKEN 无跨仓库权限。tag 由 action 在目标仓库自动创建。
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: "Release ${{ needs.resolve.outputs.tag }}"
          body_path: release_body.md
          make_latest: true
          files: dist/*

      - name: Mirror Release to dev repository (主仓库同步发布，仅 APK)
        if: needs.resolve.outputs.publishing == 'true'
        # v1.4.8 断链修复：镜像是「锦上添花」，version.json 提交才是 App 检查
        # 更新的真相源 —— 镜像偶发故障绝不能把后续 version.json 提交拖死
        # （v1.4.7.25 断链事故：镜像 404 → 后续步骤整段跳过 → 发布仓库有版、
        # 客户端永远看不到新版）。失败保留红标记，流水线继续走完关键步骤。
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          # 主仓库镜像发布：不指定 repository / token → 默认本仓库 + GITHUB_TOKEN。
          # 防回环关键：GITHUB_TOKEN 产生的事件（tag/release 创建）不会触发新的
          # workflow run —— 若此处改用 PAT，创建的 tag 会以 push 事件再次点燃
          # 本流水线的 tags 触发器，形成死循环。
          # v1.4.5 职责收紧：主仓库只镜像 APK + SHA 清单 + version.json ——
          # 增量补丁（*.vcdiff）与补丁索引（patches.json）只放发布仓库，
          # App 下载补丁固定走发布仓库直链（version.json/patches.json 的 URL
          # 均指向 RELEASE_REPO）。dist/ 的补丁文件绝不进入主仓库。
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: "Release ${{ needs.resolve.outputs.tag }}"
          body_path: release_body_dev.md
          make_latest: true
          # v1.4.8 断链修复（根因）：dist/*.apk 通配已覆盖 SHA256SUMS.apk，再
          # 显式列一次会让 action 并发上传同名资产两份 —— 第二份在资产更新
          # API（update-a-release-asset）上撞 404：v1.4.7.24 侥幸自愈、
          # v1.4.7.25 致命失败。每个文件只允许出现一次，勿再补列 SHA256SUMS.apk。
          files: |
            dist/*.apk
            dist/version.json

      - name: Commit version.json to release repo main branch
        if: needs.resolve.outputs.publishing == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA8: ${{ needs.resolve.outputs.sha8 }}
        run: |
          set -euo pipefail
          # raw CDN 版本清单 —— App 内检查更新的固定读取点。
          #
          # ── 索引幂等合并脚本 ─────────────────────────────────────────────
          # 补丁索引采用「增量合并」而非盲覆盖：generate 阶段拉取的快照到提交
          # 时可能已被 hotfix / patch-backfill / 人工恢复提交推进（v1.4.7.25
          # 断链事故当日即出现：手动恢复 .25 边与 .26 清单提交互相竞态，盲
          # 覆盖丢边）。只重放「指向本版 tag」的边（幂等键
          # variant|fromTag|toTag），既有条目永不清除、永不丢失。
          cat > /tmp/merge_patches_index.py <<'PYEOF'
          import json, os

          tag = os.environ["TAG"]
          try:
              with open("relrepo/patches.json", encoding="utf-8") as f:
                  remote = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              remote = {"patches": []}
          with open("dist/patches.json", encoding="utf-8") as f:
              ours = json.load(f)

          existing_keys = {
              (p.get("variant"), p.get("fromTag"), p.get("toTag"))
              for p in remote.get("patches", [])
          }
          merged = [p for p in remote.get("patches", []) if p.get("toTag") != tag]
          kept = len(merged)
          for p in ours.get("patches", []):
              if p.get("toTag") == tag and \
                      (p["variant"], p["fromTag"], p["toTag"]) not in existing_keys:
                  merged.append(p)

          out = {
              "generatedAt": ours.get("generatedAt") or remote.get("generatedAt"),
              "latestTag": tag,
              "patches": merged,
          }
          with open("relrepo/patches.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"📦 索引合并：远端保留 {kept} + 本版新增 "
                f"{len(merged) - kept} = {len(merged)} 条")
          PYEOF

          # ── 提交（三次重试：push 被拒时重拉远端重放，防 backfill/hotfix 竞态）──
          pushed=0
          for ATTEMPT in 1 2 3; do
            rm -rf relrepo
            git clone --depth 1 \
              "https://x-access-token:${RELEASE_TOKEN}@github.com/${RELEASE_REPO}.git" relrepo
            cp dist/version.json relrepo/version.json
            if [ -f dist/patches.json ]; then
              python3 /tmp/merge_patches_index.py
            fi
            if (
              cd relrepo
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add version.json patches.json
              if git diff --cached --quiet; then
                echo "ℹ️ 清单无变更（幂等重跑）—— 无需提交"
              else
                git commit -m "chore: version.json + patches.json → ${TAG}（dev repo ${SHA8}）"
                git push origin main
              fi
            ); then
              pushed=1
              break
            fi
            echo "⚠️ 清单提交第 ${ATTEMPT} 次尝试失败 —— 重拉远端重试（可能已被 backfill/hotfix 推进）"
            sleep $((ATTEMPT * 5))
          done
          [ "$pushed" = "1" ] || {
            echo "::error::清单三次提交失败 —— Release 资产已就位，可手动恢复或重跑本工作流"
            exit 1
          }
          echo "✅ https://raw.githubusercontent.com/${RELEASE_REPO}/main/version.json 已更新"
          echo "✅ https://raw.githubusercontent.com/${RELEASE_REPO}/main/patches.json 已更新"

      - name: Summary
        if: always()
        run: |
          {
            echo "### 🚀 发布状态"
            echo ""
            if [ "${{ needs.resolve.outputs.publishing }}" = "true" ]; then
              echo "- 流水线: **正式发布**（${{ needs.resolve.outputs.tag }}）"
              echo "- 产物页: https://github.com/${RELEASE_REPO}/releases/tag/${{ needs.resolve.outputs.tag }}"
              echo "- 主仓库镜像: https://github.com/${DEV_REPO}/releases/tag/${{ needs.resolve.outputs.tag }}"
              echo "- 版本清单: https://raw.githubusercontent.com/${RELEASE_REPO}/main/version.json"
              echo "- 客户端: App「关于 → 检查更新」即收到本版（支持增量补丁 + 镜像加速）"
            else
              echo "- 流水线: **干跑**（workflow_dispatch —— 仅构建与工件，未对外发布）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
