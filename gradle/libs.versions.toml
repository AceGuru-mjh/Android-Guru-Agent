[versions]
# Kotlin 2.2.21（K2 稳定线，2025-12 发布）：与 KSP 2.2.21-2.0.5 / AGP 8.13.x / Gradle 8.14
# 构成配套矩阵（KGP 2.2.x 官方测试上限 Gradle 8.14，AGP 上限 8.13）。升级详见 PR 讨论。
kotlin = "2.2.21"
agp = "8.13.2"
# Compose BOM 2025.11.01（Compose 1.9.5 / material3 1.4.0）：与 backdrop 1.0.1 的
# POM 声明（kotlin-stdlib 2.2.21 + Compose 1.9.5）精确配套 —— 1.9.x 是 Kotlin 2.2.21
# 工具链下的最新稳定线（ui-android 1.9.5 依赖 lifecycle 2.8.7 与本仓 pin 一致；
# 1.10.x 走 BOM 2025.12.01 + backdrop 1.0.2，留作后续独立评估）。
compose-bom = "2025.11.01"
activity-compose = "1.9.3"
lifecycle = "2.8.7"
# Hilt 2.58：Dagger 2.57+ 完全适配 KSP2 与 Kotlin 2.2（KSP 2.x 已移除 KSP1 兼容层）。
# 注意：2.59.x 的 Gradle 插件要求 AGP ≥ 9.0.0（hilt-android-gradle-plugin 内置
# 版本门禁，实测报错），与本仓 AGP 8.13.2 冲突 —— 2.58 是 AGP 8.x 线最高版
#（其门禁为 AGP ≥ 8.4.0）。AGP 9 时代再评估 2.59+。
hilt = "2.58"
# androidx.hilt 1.3.0：hilt-compiler 修复 KSP2 兼容（1.2.0 的 KSP1 API 在 KSP2 下不可用）
hilt-nav-compose = "1.3.0"
coroutines = "1.10.2"
# serialization 1.9.0：以 Kotlin 2.1.21 构建（语言版本 2.1），Kotlin 2.2.21 消费端完全兼容
serialization = "1.9.0"
okhttp = "4.12.0"
# XZ for Java —— 增量更新的 VCDIFF LZMA 二级压缩解码（纯 Java，无传递依赖，公有领域）
xz = "1.9"
shizuku = "13.1.5"
core-ktx = "1.15.0"
navigation = "2.8.5"
work = "2.10.0"
# KSP 2.x（KSP2）：版本号格式 <kotlin>-<ksp>，KSP1 已在 2.x 移除，处理器必须为 KSP2 兼容版
# （Hilt 2.57+ / Room 2.7+ / androidx.hilt 1.3.0 均已适配）
ksp = "2.2.21-2.0.5"
coil = "2.6.0"
security-crypto = "1.1.0-alpha06"
junit = "4.13.2"
# Room 2.8.x：2.7.0 起支持 KSP2（2.6.1 的 processor 基于 KSP1 API，KSP 2.x 下不可用）
room = "2.8.5"
# 赛博霓虹悬浮球（JitPack；仅允许该 group 走 jitpack 仓库，版本固定避免动态解析）
easyfloat = "2.0.4"
# Liquid Glass 底层：Maven Central 坐标 io.github.kyant0:backdrop（上游
# Kyant0/AndroidLiquidGlass，Apache-2.0）。1.0.1 的 POM 以 kotlin-stdlib 2.2.21 +
# Compose 1.9.5 构建发布 —— 与本仓 Kotlin 2.2.21 / BOM 2025.11.01 精确配套，
# 原 vendored vendor/backdrop 模块（上游 tag 1.0.0 + 两处机械适配）已整体移除；
# 包名 com.kyant.backdrop 与公共 API 逐项源兼容（1.0.0→1.0.1 仅 internal
# 实现：context parameters 化 + Compose 1.9 GraphicsLayer blendMode/colorFilter）。
# 注意：1.0.2+ 需 Compose 1.10、1.0.3+ 需 Kotlin 2.3、2.x 需 Kotlin 2.4 —— 升级前
# 先核 POM 依赖矩阵。
backdrop = "1.0.1"
# Lucide 图标集（composablehorizons/compose-icons, MIT）。2.2.1 以 Kotlin 2.2.21 +
# foundation 1.9.3 构建 —— 与本仓工具链配套；当前仓库代码零处使用 IconsLucide
# （仅 McpSoSource 抓取的网页 CSS class 字符串撞名），升 2.x 无 API 迁移面。
lucide-icons = "2.2.1"
# 物理弹力手势（SpringAnimation 按压挤压形变 / 吸附）
dynamicanimation = "1.0.0"
# apex-browser-kit（拆库 E1 迁移期；兄弟目录 includeBuild 时坐标被本地构建替换）
browser-kit = "1.1.0"
# material-icons 显式 pin 1.7.8：官方已停止演进（BOM 2025.11.01 仍映射 1.7.8，
# 解析结果不变）。长期迁移 material-symbols 待 BOM 后续大版本时评估。
compose-material-icons = "1.7.8"
# Vico —— 开源图表库（Maven Central，稳定线 1.13.1）：任务历史/记忆统计可视化。
# 选型 1.13.1（稳定版，非 2.x beta）：依赖 Compose 1.5+（Compose 向后二进制兼容，
# 1.9.5 消费端可用）；仅引 compose 核心（不引 m2/m3 主题模块，避免与本项目
# Material3 主题冲突）。
vico = "1.13.1"

[libraries]
# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose-material-icons" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "compose-material-icons" }

# AndroidX
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-nav-compose" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-nav-compose" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-nav-compose" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Serialization
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Network
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# MockWebServer — v5 测试下载/安装工具链所需（仅 testImplementation）
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# Delta update —— VCDIFF 补丁的 LZMA(.xz) 二级压缩段解码
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }

# Shizuku
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# WorkManager
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coil" }

# Security
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# 赛博霓虹悬浮球（JitPack 发布，坐标 group 为 com.github.princekin-f）
easyfloat = { group = "com.github.princekin-f", name = "EasyFloat", version.ref = "easyfloat" }

# Liquid Glass 底层引擎（Maven Central）—— 全仓玻璃渲染统一走 kyant0 backdrop
#（blur / lens 折射 / vibrancy；原 Haze 与 Cloudy 已在液态玻璃统一迁移中移除）。
# 唯一消费层：app 的 ui/glass 包（GlassSurface / TerminalGlass 单点集成）。
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }

# Lucide 图标集（Maven Central，com.composables）—— 斜杠菜单分类图标
lucide-icons = { group = "com.composables", name = "icons-lucide-android", version.ref = "lucide-icons" }

# 物理弹力手势（androidx.dynamicanimation）
dynamicanimation = { group = "androidx.dynamicanimation", name = "dynamicanimation", version.ref = "dynamicanimation" }

# apex-browser-kit 三层（core：DomParser 剪枝 / engine：BrowserEngine 自动化 / chrome：Overlay 浮窗）
browser-core = { group = "com.apex.browser", name = "browser-core", version.ref = "browser-kit" }
browser-engine = { group = "com.apex.browser", name = "browser-engine", version.ref = "browser-kit" }
browser-chrome = { group = "com.apex.browser", name = "browser-chrome", version.ref = "browser-kit" }

# Vico 开源图表库（Maven Central，稳定线 1.13.1）—— 任务历史/记忆统计可视化
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Testing (unit tests in app/src/test)
junit = { group = "junit", name = "junit", version.ref = "junit" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Testing (P70: real-JNI instrumentation tests in platform/terminal/src/androidTest)
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Compose 编译器插件（Kotlin 同版本号发布；#266：原 app 模块硬编码 2.0.21，
# 收编 catalog 保证与 kotlin 版本永不脱钩）
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
