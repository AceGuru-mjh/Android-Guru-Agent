[versions]
kotlin = "2.0.21"
agp = "8.7.3"
compose-bom = "2024.12.01"
activity-compose = "1.9.3"
lifecycle = "2.8.7"
hilt = "2.53.1"
hilt-nav-compose = "1.2.0"
coroutines = "1.9.0"
serialization = "1.7.3"
okhttp = "4.12.0"
# XZ for Java —— 增量更新的 VCDIFF LZMA 二级压缩解码（纯 Java，无传递依赖，公有领域）
xz = "1.9"
shizuku = "13.1.5"
core-ktx = "1.15.0"
navigation = "2.8.5"
work = "2.10.0"
ksp = "2.0.21-1.0.28"
coil = "2.6.0"
security-crypto = "1.1.0-alpha06"
junit = "4.13.2"
room = "2.6.1"
# 赛博霓虹悬浮球（JitPack；仅允许该 group 走 jitpack 仓库，版本固定避免动态解析）
easyfloat = "2.0.4"
# Liquid Glass 底层 —— Haze：GPU GraphicsLayer 背景采样 + RenderEffect 模糊（Maven Central）
# 选型 1.4.0：字节码级验证 90 个 Compose 引用全部存在于本项目 Compose 1.7.6；
# compileSdk 35 对齐；Kotlin 2.1.0 元数据对 2.0.21 消费端一版向前兼容。
haze = "1.4.0"
# Liquid Glass 自体模糊 —— Cloudy（Maven Central，com.github.skydoves）
# 选型 0.2.3：1.0.0-alpha01 需 Kotlin 2.4（本项目 2.0.21 ✗）；0.2.7 需 Compose 1.8.1
# （BOM 2024.12.01 = 1.7.6 ✗）；0.2.3 = Compose 1.7.1 + Kotlin 2.0.20 与本项目完全兼容。
# 源码级核实：Modifier.cloudy(radius: Int) 自体位图模糊，全 API 级别走原生
# RenderScriptToolkit（NEON/SIMD CPU）；AAR minSdk 21 < 26 ✓；含 baseline profile。
cloudy = "0.2.3"
# Lucide 图标集（composablehorizons/compose-icons, MIT）：斜杠菜单分类图标。
# 固定 1.1.0：2.x 由 Kotlin 2.2 构建，与本项目 Kotlin 2.0.21 toolchain 元数据不兼容。
lucide-icons = "1.1.0"
# 物理弹力手势（SpringAnimation 按压挤压形变 / 吸附）
dynamicanimation = "1.0.0"
# apex-browser-kit（拆库 E1 迁移期；兄弟目录 includeBuild 时坐标被本地构建替换）
browser-kit = "1.1.0"
# material-icons 显式 pin：1.7.8 高于 BOM 2024.12.01 映射的 1.7.6，
# 保持既有解析结果（Gradle 取高版本）不变 —— 升 BOM 前先复核此 pin。
compose-material-icons = "1.7.8"
# Vico —— 开源图表库（Maven Central，稳定线 1.13.1）：任务历史/记忆统计可视化。
# 选型 1.13.1（稳定版，非 2.x beta）：依赖 Compose 1.5+（本项目 1.7.6 向后兼容），
# Kotlin 1.9 编译产物对 2.0.21 消费端零影响；仅引 compose 核心（不引 m2/m3 主题模块，
# 避免与本项目 Material3 主题冲突）。
vico = "1.13.1"

[libraries]
# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose-material-icons" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "compose-material-icons" }

# AndroidX
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-nav-compose" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version = "1.2.0" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version = "1.2.0" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Serialization
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Network
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# MockWebServer — v5 测试下载/安装工具链所需（仅 testImplementation）
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }

# Delta update —— VCDIFF 补丁的 LZMA(.xz) 二级压缩段解码
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }

# Shizuku
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# WorkManager
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coil" }

# Security
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# 赛博霓虹悬浮球（JitPack 发布，坐标 group 为 com.github.princekin-f）
easyfloat = { group = "com.github.princekin-f", name = "EasyFloat", version.ref = "easyfloat" }

# Liquid Glass 底层引擎（Maven Central，dev.chrisbanes.haze）—— ui/glass 包唯一底层依赖
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }

# Liquid Glass 自体模糊引擎（Maven Central，com.github.skydoves）—— ui/glass 包唯一集成点
# （Frosted 档 Cloudy 变体：材质层自绘光带纹理经真实位图模糊扩散，聊天气泡专用）
cloudy = { group = "com.github.skydoves", name = "cloudy", version.ref = "cloudy" }

# Lucide 图标集（Maven Central，com.composables）—— 斜杠菜单分类图标
lucide-icons = { group = "com.composables", name = "icons-lucide-android", version.ref = "lucide-icons" }

# 物理弹力手势（androidx.dynamicanimation）
dynamicanimation = { group = "androidx.dynamicanimation", name = "dynamicanimation", version.ref = "dynamicanimation" }

# apex-browser-kit 三层（core：DomParser 剪枝 / engine：BrowserEngine 自动化 / chrome：Overlay 浮窗）
browser-core = { group = "com.apex.browser", name = "browser-core", version.ref = "browser-kit" }
browser-engine = { group = "com.apex.browser", name = "browser-engine", version.ref = "browser-kit" }
browser-chrome = { group = "com.apex.browser", name = "browser-chrome", version.ref = "browser-kit" }

# Vico 开源图表库（Maven Central，稳定线 1.13.1）—— 任务历史/记忆统计可视化
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Testing (unit tests in app/src/test)
junit = { group = "junit", name = "junit", version.ref = "junit" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Testing (P70: real-JNI instrumentation tests in platform/terminal/src/androidTest)
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-test-runner = { group = "androidx.test", name = "runner", version = "1.6.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Compose 编译器插件（Kotlin 同版本号发布；#266：原 app 模块硬编码 2.0.21，
# 收编 catalog 保证与 kotlin 版本永不脱钩）
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
